[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "censtrunc"
version = "0.1.0"
description = "Censored and truncated regression models with arbitrary left/right thresholds (generalized Tobit)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "<Your Name>", email = "your.email@example.com" },
]
keywords = [
    "tobit",
    "censored regression",
    "truncated regression",
    "econometrics",
    "maximum likelihood",
    "limited dependent variable",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
test = [
    "pytest>=7",
    "pandas>=2.0",
    "statsmodels>=0.14",
]
examples = [
    "pandas>=2.0",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "jupyter>=1.0",
    "nbformat>=5.9",
    "nbclient>=0.8",
]
dev = [
    "pytest>=7",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/<your-username>/censtrunc"
Repository = "https://github.com/<your-username>/censtrunc"
Issues = "https://github.com/<your-username>/censtrunc/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
censtrunc = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter
